[package]
name = "store-creative-loop"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Deterministic policy gates and blind multi-lens review for app-store creative sets"
repository = "https://github.com/Loop-Suite/store-creative-loop"

[[bin]]
name = "storeloop"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2"
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
imageproc = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.9"
ureq = { version = "2.12", features = ["json"] }

[dev-dependencies]
tempfile = "3.20"
