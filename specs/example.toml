name = "Example multi-store creative review"
context = "A productivity app is preparing one coherent store story across phone, tablet, and Google Play feature art."
audience = "Busy people comparing unfamiliar productivity apps from a small store preview."
product_truth = [
  "The app supports phone and tablet layouts.",
  "Every claim shown in a creative must be demonstrable in the shipped build."
]
prohibited_claims = [
  "#1 app",
  "guaranteed results",
  "free when a paid commitment is required"
]
thumbnail_width = 220
critic_backends = ["claude", "openrouter", "claude"]
openrouter_critic_model = "openai/gpt-4.1-mini"

[generation]
brand_name = "Example"
tagline = "One clear story across every device"
source_target = "apple_iphone_69_ko"
frame_count = 3
generator_backend = "openrouter"
generator_model = "openai/gpt-4.1-mini"
style_direction = "Generate category-native directions rather than one house style. Keep real UI prominent, copy concise, and every visual claim verifiable."
palette = ["#0B1020", "#182748", "#64E4D2", "#F8F9FC", "#BEC2CF"]
allowed_layouts = ["ui_dominant", "ui_focus", "device_center", "device_bottom"]
creative_families = ["product_led", "outcome_led", "trust_led"]
verified_claim_tokens = []

[generation.art_direction]
story_roles = ["hero", "overview", "synthesis"]
allowed_compositions = ["editorial_hero", "editorial_split", "chapter_field", "synthesis_dark"]
allowed_decorations = ["spectrum", "orbit", "grid", "signal"]
frame_accents = ["#64E4D2", "#4D91FF", "#8B59E2", "#EE5050", "#E6A341"]
max_consecutive_same_composition = 1
min_unique_compositions = 3

[[generation.segments]]
id = "new_user"
audience = "People seeing the category and product for the first time."
intent = "Understand the primary outcome and whether the app is easy to start."
keywords = ["easy", "start", "save time"]

[[generation.segments]]
id = "power_user"
audience = "Experienced category users comparing advanced capability."
intent = "Verify depth, control, and concrete differentiation."
keywords = ["workflow", "control", "advanced"]

[[targets]]
id = "apple_iphone_69_ko"
store = "apple"
device = "iPhone 6.9-inch display"
locale = "ko-KR"
kind = "screenshot"
required = true
min_assets = 3
max_assets = 10
allowed_sizes = [{ width = 1260, height = 2736 }]

[[targets]]
id = "apple_ipad_13_ko"
store = "apple"
device = "iPad 13-inch display"
locale = "ko-KR"
kind = "screenshot"
required = true
min_assets = 3
max_assets = 10
allowed_sizes = [
  { width = 2064, height = 2752 },
  { width = 2048, height = 2732 }
]

[[targets]]
id = "google_phone_ko"
store = "google"
device = "Android phone"
locale = "ko-KR"
kind = "screenshot"
required = true
min_assets = 2
max_assets = 8
allowed_sizes = [{ width = 1080, height = 1920 }]

[[targets]]
id = "google_tablet_ko"
store = "google"
device = "Android tablet"
locale = "ko-KR"
kind = "screenshot"
required = true
min_assets = 2
max_assets = 8
allowed_sizes = [{ width = 1600, height = 2560 }]

[[targets]]
id = "google_feature_ko"
store = "google"
device = "Google Play feature graphic"
locale = "ko-KR"
kind = "feature_graphic"
required = true
min_assets = 1
max_assets = 1
exact_assets = 1
allowed_sizes = [{ width = 1024, height = 500 }]

[[criteria]]
id = "first_glance"
name = "First-glance comprehension"
weight = 1.3
guide = "At store thumbnail scale, can a new viewer identify the product promise and intended category quickly?"

[[criteria]]
id = "value_clarity"
name = "Value clarity"
weight = 1.2
guide = "Does the set communicate concrete user value instead of generic superlatives?"

[[criteria]]
id = "sequence"
name = "Sequence and narrative"
weight = 1.0
guide = "Do frames progress without repetition, and do the first frames carry the strongest story?"

[[criteria]]
id = "visual_hierarchy"
name = "Visual hierarchy"
weight = 1.0
guide = "Are copy, product UI, contrast, spacing, and focal points legible without visual competition?"

[[criteria]]
id = "truth_trust"
name = "Truth and trust"
weight = 1.4
guide = "Are claims supported by supplied product truths, and does the creative avoid misleading UI or unsupported status claims?"

[[criteria]]
id = "device_fit"
name = "Device and format fit"
weight = 0.9
guide = "Does each phone, tablet, and feature-graphic target use its space intentionally rather than merely scaling one composition?"

[[criteria]]
id = "localization_accessibility"
name = "Localization and accessibility"
weight = 1.1
guide = "Are language, text density, contrast, reading order, and culturally specific assumptions appropriate for the locale?"

[[lenses]]
id = "first_time_user"
name = "First-time store visitor"
instruction = "Start with an unprimed thumbnail read. Note what is actually understood before interpreting intent."

[[lenses]]
id = "conversion_strategy"
name = "Store conversion strategist"
instruction = "Examine message-market fit, sequencing, differentiation, and whether the proposed experiment isolates one useful hypothesis."

[[lenses]]
id = "visual_design"
name = "Visual and brand designer"
instruction = "Inspect hierarchy, typography, composition, rhythm, image/copy relationship, coherence, and category distinctiveness."

[[lenses]]
id = "trust_policy"
name = "Trust and store-policy reviewer"
instruction = "Look for unsupported claims, simulated product behavior, misleading price/status signals, and policy-sensitive creative choices."

[[lenses]]
id = "accessibility_localization"
name = "Accessibility and localization reviewer"
instruction = "Inspect contrast, small-scale readability, reading order, text expansion risk, locale fit, and avoidable exclusion."

[[lenses]]
id = "device_specialist"
name = "Phone and tablet specialist"
instruction = "Compare how the story adapts across phone, tablet, and feature art; flag stretched or reused compositions that ignore format behavior."

[experiment]
variable = "first-frame value proposition only"
primary_metric = "first-time download conversion rate"
guardrails = ["1-day retention", "refund or uninstall signal", "support contacts about misleading claims"]
min_days = 7
